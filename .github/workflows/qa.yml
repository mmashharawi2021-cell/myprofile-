name: Portfolio quality assurance

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "qa/**"
      - "feature/seo-*"
      - "feature/social-*"
      - "feature/satellite-*"
      - "feature/smooth-*"
      - "feature/laser-*"
      - "feature/digital-*"
      - "feature/faithful-*"
      - "feature/approved-*"
      - "feature/signature-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Record QA run metadata
        run: |
          mkdir -p qa-artifacts
          printf 'commit=%s\nref=%s\nevent=%s\nnode=%s\n' \
            "$GITHUB_SHA" "$GITHUB_REF" "$GITHUB_EVENT_NAME" "$(node --version)" > qa-artifacts/run-info.txt
      - name: Install dependencies
        run: npm ci
      - name: TypeScript and production build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee qa-artifacts/build.log
      - name: Render approved sharing image as PNG
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin fonts-noto-core
          rsvg-convert --width 1200 --height 630 --output docs/og-preview.png app/public/og-preview.svg
          test -s docs/og-preview.png
      - name: Static release file integrity
        run: |
          set -o pipefail
          node --test scripts/release-static.test.mjs 2>&1 | tee qa-artifacts/release-static-tests.log
      - name: SEO metadata, sitemap and image checks
        run: |
          set -o pipefail
          node --test scripts/seo.test.mjs 2>&1 | tee qa-artifacts/seo-tests.log
      # Install Playwright separately: npm install in the root re-resolves
      # unrelated Rollup packages and can fail on registry replication.
      - name: Install browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/portfolio-playwright" --no-save --package-lock=false playwright@1.55.1
          ln -s "$RUNNER_TEMP/portfolio-playwright/node_modules/playwright" node_modules/playwright
      - name: Install Chromium
        run: |
          "$RUNNER_TEMP/portfolio-playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Browser regression tests
        run: |
          set -o pipefail
          node scripts/qa-browser.mjs 2>&1 | tee qa-artifacts/browser-tests.log
      - name: Preserve generated CV PDF for review
        if: always()
        run: |
          if [ -f docs/cv/Mohanad-Almashharawi-CV.pdf ]; then
            cp docs/cv/Mohanad-Almashharawi-CV.pdf qa-artifacts/Mohanad-Almashharawi-CV.pdf
          fi
      - name: Upload QA report and mobile/desktop screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-qa
          path: qa-artifacts/
          if-no-files-found: ignore
          retention-days: 30

