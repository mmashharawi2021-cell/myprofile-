name: Portfolio quality assurance

on:
  push:
    branches:
      - main
      - "qa/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript and production build
        run: npm run build
      - name: CMS API integration tests
        run: node --test server/editor.test.mjs
      - name: Install browser test runtime
        run: npm install --no-save --package-lock=false playwright@1.55.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser regression tests
        run: node scripts/qa-browser.mjs
      - name: Upload QA report and mobile/desktop screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-qa
          path: qa-artifacts/
          if-no-files-found: ignore
          retention-days: 14
