name: Portfolio quality assurance

on:
  push:
    branches:
      - main
      - "qa/**"
      - "feature/seo-*"
      - "feature/social-*"
      - "feature/satellite-*"
      - "feature/smooth-*"
      - "feature/laser-*"
      - "feature/digital-*"
      - "feature/faithful-*"
      - "feature/approved-*"
      - "feature/signature-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript and production build
        run: npm run build
      - name: Render approved sharing image as PNG
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin fonts-noto-core
          rsvg-convert --width 1200 --height 630 --output docs/og-preview.png app/public/og-preview.svg
          test -s docs/og-preview.png
      - name: SEO metadata, sitemap and image checks
        run: node --test scripts/seo.test.mjs
      - name: CMS API integration tests
        run: node --test server/editor.test.mjs
      # Install Playwright separately: npm install in the root re-resolves
      # unrelated Rollup packages and can fail on registry replication.
      - name: Install browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/portfolio-playwright" --no-save --package-lock=false playwright@1.55.1
          ln -s "$RUNNER_TEMP/portfolio-playwright/node_modules/playwright" node_modules/playwright
      - name: Install Chromium
        run: |
          "$RUNNER_TEMP/portfolio-playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Browser regression tests
        run: node scripts/qa-browser.mjs
      - name: Upload QA report and mobile/desktop screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-qa
          path: qa-artifacts/
          if-no-files-found: ignore
          retention-days: 14
