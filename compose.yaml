name: myprofile-cms
services:
  portfolio:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - portfolio_data:/data
    secrets:
      - editor_credentials
    environment:
      COOKIE_SECURE: "false"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      start_period: 15s
      retries: 3
secrets:
  editor_credentials:
    file: ./.secrets/editor-credentials.json
volumes:
  portfolio_data:
